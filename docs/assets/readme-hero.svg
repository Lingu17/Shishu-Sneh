<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Shishu-Sneh — Every feed, every dose, on time.</title>
  <desc id="desc">Shishu-Sneh is a Kotlin Android app that tracks a baby&#x27;s growth, vaccinations, feeding and milestones with local storage and scheduled reminders.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#2a1520"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#fb7185"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#94a3b8" opacity=".12"/></pattern>
  </defs>
  <rect width="1200" height="460" rx="24" fill="url(#background)"/>
  <rect width="1200" height="460" rx="24" fill="url(#dots)"/>
  <path d="M700 0H1100L800 460H400Z" fill="#fb7185" opacity=".04"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <path d="m57 40 16-8 16 8-16 8Zm0 8 16 8 16-8M57 56l16 8 16-8" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="103" y="56" fill="#f8fafc" font-size="23.0" font-weight="700">Shishu<tspan fill="#fb7185">-Sneh</tspan></text>
    <text x="56" y="128" fill="#f8fafc" font-size="54.0" font-weight="750" letter-spacing="-2">Every feed, every dose,</text>
    <text x="56" y="190" fill="url(#accent)" font-size="54.0" font-weight="750" letter-spacing="-2">on time.</text>
    <text x="58" y="228" fill="#cbd5e1" font-size="18.0">An Android companion for tracking a baby&#x27;s growth, vaccinations and milestones.</text>
    <rect x="842" y="72" width="302" height="159" rx="14" fill="#0b1020" stroke="#37304f"/>
    <path d="M842 110h302" stroke="#37304f"/>
    <circle cx="861" cy="91" r="4" fill="#fb7185"/><circle cx="876" cy="91" r="4" fill="#475569"/><circle cx="891" cy="91" r="4" fill="#475569"/>
    <text x="916" y="96" fill="#94a3b8" font-size="12">baby / care log</text>
    <g font-family="Consolas,Monaco,monospace" font-size="14.0">
      <text x="862" y="138" fill="#fb7185">growth<tspan fill="#94a3b8"> → chart</tspan></text>
      <text x="862" y="166" fill="#fbbf24">vaccine due<tspan fill="#94a3b8"> → reminder</tspan></text>
      <text x="862" y="194" fill="#34d399">feeding<tspan fill="#94a3b8"> → periodic alert</tspan></text>
    </g>
    <g fill="#191c30" stroke="#35354e">
      <rect x="56" y="282" width="258" height="106" rx="12"/>
      <rect x="332" y="282" width="258" height="106" rx="12"/>
      <rect x="608" y="282" width="258" height="106" rx="12"/>
      <rect x="884" y="282" width="260" height="106" rx="12"/>
    </g>
    <g fill="#fb7185" font-size="12" font-weight="700" letter-spacing="2">
      <text x="76" y="309">01 / PROFILE</text>
      <text x="352" y="309">02 / TRACK</text>
      <text x="628" y="309">03 / REMIND</text>
      <text x="904" y="309">04 / SHARE</text>
    </g>
    <text x="76" y="341" fill="#f1f5f9" font-size="17.0" font-weight="650">Add your baby</text>
    <text x="76" y="367" fill="#94a3b8" font-size="13.0">Stored on the device</text>
    <text x="352" y="341" fill="#f1f5f9" font-size="17.0" font-weight="650">Log growth + activity</text>
    <text x="352" y="367" fill="#94a3b8" font-size="13.0">MPAndroidChart trends</text>
    <text x="628" y="341" fill="#f1f5f9" font-size="17.0" font-weight="650">Never miss a vaccine</text>
    <text x="628" y="367" fill="#94a3b8" font-size="13.0">WorkManager notifications</text>
    <text x="904" y="341" fill="#f1f5f9" font-size="17.0" font-weight="650">Export a PDF report</text>
    <text x="904" y="367" fill="#94a3b8" font-size="13.0">Share in one tap</text>
    <text x="56" y="428" fill="#64748b" font-size="13">Kotlin · Room · WorkManager · MPAndroidChart · Firebase Auth · English, Hindi, Kannada</text>
  </g>
</svg>
